services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${TIMESCALEDB_USER:-postgres}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres}
      POSTGRES_DB: ${TIMESCALEDB_DATABASE:-pactum_timeseries}
    ports:
      - "${TIMESCALEDB_PORT:-5432}:5432"
    volumes:
      - pactum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${TIMESCALEDB_USER:-postgres} -d ${TIMESCALEDB_DATABASE:-pactum_timeseries}
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      TIMESCALEDB_HOST: postgres
      TIMESCALEDB_PORT: 5432
      TIMESCALEDB_DATABASE: ${TIMESCALEDB_DATABASE:-pactum_timeseries}
      TIMESCALEDB_USER: ${TIMESCALEDB_USER:-postgres}
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-postgres}
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org:443}
      SOROBAN_NETWORK_PASSPHRASE: ${SOROBAN_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      SOROBAN_CONTRACT_ID: ${SOROBAN_CONTRACT_ID:-CBADTVTJ6IN332HIKZ7LWUYMYTLPZYCEBV3X2HS47VHR5UDBHQ3GAA7E}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL-}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pactum-postgres-data:
