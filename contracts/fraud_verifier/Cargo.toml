[package]
name = "pactum-fraud-verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "22.0.0", features = ["alloc"] }

# Poseidon hash matching circomlibjs BN254 round constants — no_std compatible.
# Used to compute commitment leaf hashes identical to the ZK circuit.
light-poseidon-nostd = { version = "0.4", default-features = false }
ark-ff  = { version = "0.6", default-features = false, features = ["asm"] }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }


[dev-dependencies]
hex = "0.4.3"
soroban-sdk = { version = "22.0.0", features = ["alloc", "testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
