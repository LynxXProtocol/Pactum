name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # The upgrade tests embed a compiled Wasm fixture in order to exercise a real
      # executable swap, so the artifacts have to exist before the tests are compiled.
      - name: Build Wasm artifacts for the upgrade tests
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run Soroban contract test suite
        working-directory: contracts
        run: cargo test --workspace --features registry/wasm-tests,timelock/wasm-tests

  zk-tests:
    name: ZK Circuit Tests
    runs-on: ubuntu-latest
    # Building circom from source dominates a cold run. The cap is here so a hang in
    # the proving toolchain fails the job promptly instead of burning the default
    # six-hour budget.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 22.18+ runs the package's TypeScript sources directly, so there is no
      # build step to keep in sync with the tests.
      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # circom is not published to npm, so it is built from source and cached — the
      # circuit tests skip without it, and a skipped circuit test proves nothing.
      - name: Cache circom binary
        id: cache_circom
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/circom
          key: ${{ runner.os }}-circom-2.2.3

      - name: Build circom from source
        if: steps.cache_circom.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/iden3/circom.git --tag v2.2.3 circom

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-zk-${{ hashFiles('zk/package-lock.json', 'zk/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-zk-

      - name: Install zk dependencies
        working-directory: zk
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Compile circuit and run the Groth16 setup
        working-directory: zk
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run build:circuit

      - name: Run zk test suite
        working-directory: zk
        run: npm test

  migration-dry-run:
    name: Migration Dry-Run
    runs-on: ubuntu-latest
    env:
      # Custom runner reads TIMESCALEDB_* env vars; point them at the ephemeral
      # timescaledb service container spun up for this job.
      TIMESCALEDB_HOST: localhost
      TIMESCALEDB_PORT: 5432
      TIMESCALEDB_DATABASE: pactum_migration_test
      TIMESCALEDB_USER: postgres
      TIMESCALEDB_PASSWORD: postgres
    services:
      postgres:
        # Same image docker-compose.yml uses for the real service, so
        # CREATE EXTENSION timescaledb (001_timescale_setup.sql) succeeds here
        # instead of only in the full docker-compose e2e stack.
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pactum_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pactum_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('backend/package-lock.json', 'backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install backend dependencies
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run migration dry-run against ephemeral TimescaleDB
        working-directory: backend
        run: node dist/db/migrate-dry-run.js

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pactum_test
      # Testcontainers environment variables for GitHub Actions
      TESTCONTAINERS_RYUK_DISABLED: true
      TESTCONTAINERS_RYUK_PRIVILEGED: true
      DOCKER_HOST: unix:///var/run/docker.sock

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pactum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pactum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker permission for Testcontainers to work properly
      - name: Setup Docker permissions
        run: |
          sudo chmod 666 /var/run/docker.sock
          docker info

      # Temporary check until the backend phase begins: skip gracefully if package.json does not exist or is empty
      - name: Check if backend package.json exists and is non-empty
        id: check_backend
        run: |
          if [ -s backend/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend Skipped::backend/package.json is missing or empty. Skipping backend tests gracefully until backend phase begins."
          fi

      - name: Set up Node.js 22.x (LTS)
        if: steps.check_backend.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cache npm dependencies
        if: steps.check_backend.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('backend/package-lock.json', 'backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install backend dependencies
        if: steps.check_backend.outputs.ready == 'true'
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run backend linter
        if: steps.check_backend.outputs.ready == 'true'
        working-directory: backend
        run: npm run --if-present lint

      - name: Run backend test suite
        if: steps.check_backend.outputs.ready == 'true'
        working-directory: backend
        run: |
          if node -e "const pkg = require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test && pkg.scripts.test !== 'echo \"Error: no test specified\" && exit 1' ? 0 : 1)"; then
            npm test
          else
            echo "No valid test script defined in backend/package.json yet. Skipping test execution."
          fi

      # Testcontainers boots its own ephemeral Postgres via the Docker daemon
      # already available on ubuntu-latest -- no services: entry needed.
      - name: Run backend integration tests (Testcontainers)
        if: steps.check_backend.outputs.ready == 'true'
        working-directory: backend
        run: npm run test:integration

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm ci --include=optional

      - name: Run frontend linter
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        # playwright.config.ts (testDir: ./e2e) runs both a chromium and a firefox project.
        run: npx playwright install --with-deps chromium firefox

      # playwright.config.ts's webServer also builds+previews the dashboard/wizard Module
      # Federation remotes (see docs/module-federation.md) since the host now lazy-loads them
      # instead of bundling them directly -- each is an independent npm project needing its own
      # install.
      - name: Install dashboard remote dependencies
        working-directory: frontend-dashboard-remote
        run: |
          rm -rf node_modules
          npm ci --include=optional

      - name: Install wizard remote dependencies
        working-directory: frontend-wizard-remote
        run: |
          rm -rf node_modules
          npm ci --include=optional

      - name: Run frontend e2e tests
        working-directory: frontend
        run: npm run test:e2e

  sdk-tests:
    name: SDK Tests (@pactum/sdk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-sdk-node-${{ hashFiles('sdk/js/package-lock.json', 'sdk/js/package.json') }}
          restore-keys: |
            ${{ runner.os }}-sdk-node-

      - name: Install SDK dependencies
        working-directory: sdk/js
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build SDK
        working-directory: sdk/js
        run: npm run build

      - name: Run SDK tests
        working-directory: sdk/js
        run: npm test

  frontend-tests:
    name: Frontend Tests (Module Federation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # The host and the two Module Federation remotes it loads at runtime (see
      # docs/module-federation.md) are independent npm projects, each installed separately.
      - name: Install host dependencies
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm ci --include=optional

      - name: Install dashboard remote dependencies
        working-directory: frontend-dashboard-remote
        run: |
          rm -rf node_modules
          npm ci --include=optional

      - name: Install wizard remote dependencies
        working-directory: frontend-wizard-remote
        run: |
          rm -rf node_modules
          npm ci --include=optional

      - name: Typecheck and build dashboard remote
        working-directory: frontend-dashboard-remote
        run: npm run build

      - name: Typecheck and build wizard remote
        working-directory: frontend-wizard-remote
        run: npm run build

      # Not `npm run build`: that chains through `build:wasm`, which needs a Rust toolchain to
      # regenerate src/wasm/pactum-validation/ via wasm-pack. This job doesn't set one up, and
      # that output is already committed and current, so typecheck + bundle directly instead.
      - name: Typecheck and build host
        working-directory: frontend
        run: npx tsc -b && npx vite build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # playwright.module-federation.config.ts starts the host and both remotes (build + preview,
      # not dev servers — see the config file's comments) and tears them down afterwards.
      - name: Run Module Federation e2e tests
        working-directory: frontend
        run: npx playwright test --config=playwright.module-federation.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-module-federation
          path: frontend/playwright-report/
          retention-days: 7
