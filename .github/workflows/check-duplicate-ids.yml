name: Check Duplicate IDs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-duplicate-ids:
    name: Check Duplicate Discriminants and Migration Prefixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '"3.11"'

      - name: Check for duplicate error discriminants and migration prefixes
        run: python scripts/check_duplicate_ids.py
